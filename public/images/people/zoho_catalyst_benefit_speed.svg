<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <g stroke="#334155" stroke-width="0.5" opacity="0.15">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>

  <!-- Left: Developer terminal -->
  <g transform="translate(30, 60)">
    <rect width="240" height="200" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="25" rx="3" fill="#1e293b"/>
    <circle cx="15" cy="12.5" r="4" fill="#ef4444"/>
    <circle cx="27" cy="12.5" r="4" fill="#f59e0b"/>
    <circle cx="39" cy="12.5" r="4" fill="#10b981"/>
    <text x="60" y="17" fill="#64748b" font-family="monospace" font-size="10">bash - local-dev</text>
    
    <g transform="translate(15, 45)" font-family="monospace" font-size="11">
      <text x="0" y="15" fill="#38bdf8">$</text>
      <text x="15" y="15" fill="#e2e8f0">catalyst deploy --only functions</text>
      
      <text x="0" y="35" fill="#94a3b8">Deploying production function package...</text>
      
      <text x="0" y="55" fill="#34d399">✔</text>
      <text x="15" y="55" fill="#e2e8f0">Auth endpoints verified</text>
      
      <text x="0" y="75" fill="#34d399">✔</text>
      <text x="15" y="75" fill="#e2e8f0">API routes linked</text>
      
      <text x="0" y="95" fill="#34d399">✔</text>
      <text x="15" y="95" fill="#34d399" font-weight="bold">Deployment complete [0.85s]</text>
      
      <text x="0" y="125" fill="#38bdf8">$</text>
      <line x1="15" y1="122" x2="25" y2="122" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right: Speed/Lightning Graphics -->
  <g transform="translate(320, 60)">
    <!-- Speedometer / Performance graphic -->
    <circle cx="70" cy="80" r="50" fill="none" stroke="#1e293b" stroke-width="8"/>
    <path d="M25,95 A50,50 0 1,1 115,95" fill="none" stroke="url(#neonPurple)" stroke-dasharray="140 100" stroke-width="8" stroke-linecap="round"/>
    <!-- Glowing needle -->
    <line x1="70" y1="80" x2="105" y2="45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="70" cy="80" r="8" fill="#ffffff"/>
    
    <text x="70" y="150" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Instant Deploy</text>
    <text x="70" y="170" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" filter="url(#glow)">&lt; 1 Second</text>
  </g>
</svg>
