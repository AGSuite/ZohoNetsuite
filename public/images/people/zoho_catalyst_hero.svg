<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Technical Grid Pattern overlay -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>

  <!-- Abstract Tech Circuits (Glowing background details) -->
  <path d="M100,100 L300,100 L400,200 L600,200 L700,300" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M200,500 L300,500 L350,450 L500,450 L550,550 L700,550" fill="none" stroke="#1e293b" stroke-width="2" />
  
  <!-- Central Architecture Components -->
  
  <!-- CLIENT LAYER -->
  <g transform="translate(50, 100)">
    <!-- Client Box -->
    <rect width="160" height="400" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="80" y="30" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">CLIENT LAYER</text>
    
    <!-- Web Client -->
    <g transform="translate(15, 60)">
      <rect width="130" height="80" rx="8" fill="#1e293b" stroke="url(#neonBlue)" stroke-width="1.5"/>
      <rect width="130" height="15" rx="3" fill="#334155"/>
      <circle cx="10" cy="7.5" r="3" fill="#ef4444"/>
      <circle cx="20" cy="7.5" r="3" fill="#f59e0b"/>
      <circle cx="30" cy="7.5" r="3" fill="#10b981"/>
      <path d="M20,40 L40,40 M20,50 L60,50 M20,60 L50,60" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <!-- Small realistic details -->
      <line x1="80" y1="35" x2="110" y2="65" stroke="url(#neonBlue)" stroke-width="1"/>
      <circle cx="95" cy="50" r="10" fill="none" stroke="url(#neonBlue)" stroke-width="1.5"/>
      <text x="65" y="72" fill="#0ea5e9" font-family="monospace" font-size="10">Web App</text>
    </g>
    
    <!-- Mobile Client -->
    <g transform="translate(15, 170)">
      <rect width="130" height="80" rx="8" fill="#1e293b" stroke="url(#neonBlue)" stroke-width="1.5"/>
      <circle cx="65" cy="72" r="4" fill="#64748b"/>
      <rect x="15" y="10" width="100" height="52" rx="3" fill="#0f172a"/>
      <!-- Mobile screen graphic -->
      <path d="M30,30 L50,30 M30,40 L65,40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="85" cy="35" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="65" y="77" fill="#0ea5e9" font-family="monospace" font-size="9" text-anchor="middle"></text>
      <text x="65" y="72" fill="#0ea5e9" font-family="monospace" font-size="10" text-anchor="middle">iOS / Android</text>
    </g>
    
    <!-- IoT / API Client -->
    <g transform="translate(15, 280)">
      <rect width="130" height="80" rx="8" fill="#1e293b" stroke="url(#neonBlue)" stroke-width="1.5"/>
      <path d="M40,30 L90,30 L90,60 L40,60 Z" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="65" cy="45" r="15" fill="none" stroke="url(#neonBlue)" stroke-width="1.5" filter="url(#glow)"/>
      <path d="M60,45 L70,45 M65,40 L65,50" stroke="#38bdf8" stroke-width="2"/>
      <text x="65" y="72" fill="#0ea5e9" font-family="monospace" font-size="10" text-anchor="middle">API Clients</text>
    </g>
  </g>

  <!-- CONNECTIONS -->
  <g stroke="url(#neonBlue)" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <path d="M210,190 L300,190"/>
    <path d="M210,300 L300,300"/>
    <path d="M210,410 L300,410"/>
  </g>
  
  <!-- SERVERLESS GATEWAY & ROUTING -->
  <g transform="translate(300, 100)">
    <rect width="180" height="400" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="30" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">COMPUTE &amp; LOGIC</text>
    
    <!-- API Gateway Box -->
    <g transform="translate(15, 60)">
      <rect width="150" height="60" rx="8" fill="#1e293b" stroke="url(#neonPurple)" stroke-width="1.5" filter="url(#glow)"/>
      <text x="75" y="35" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">API GATEWAY</text>
    </g>
    
    <!-- Serverless Functions (Node, Python, Java) -->
    <g transform="translate(15, 140)">
      <rect width="150" height="230" rx="8" fill="#1e293b" stroke="url(#neonPurple)" stroke-width="1.5"/>
      <text x="75" y="25" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="bold">FUNCTIONS</text>
      
      <!-- Function Blocks -->
      <g transform="translate(10, 40)">
        <rect width="130" height="45" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="27" fill="#60a5fa" font-family="monospace" font-size="11">fn: getUser()</text>
        <circle cx="115" cy="22" r="5" fill="#10b981"/>
      </g>
      <g transform="translate(10, 100)">
        <rect width="130" height="45" rx="5" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
        <text x="15" y="27" fill="#c084fc" font-family="monospace" font-size="11">fn: processOrder()</text>
        <circle cx="115" cy="22" r="5" fill="#10b981"/>
      </g>
      <g transform="translate(10, 160)">
        <rect width="130" height="45" rx="5" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
        <text x="15" y="27" fill="#2dd4bf" font-family="monospace" font-size="11">fn: generatePDF()</text>
        <circle cx="115" cy="22" r="5" fill="#f59e0b"/>
      </g>
    </g>
  </g>

  <!-- CONNECTIONS -->
  <g stroke="url(#neonPurple)" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <path d="M480,240 L570,240"/>
    <path d="M480,300 L570,300"/>
    <path d="M480,360 L570,360"/>
  </g>
  
  <!-- DATA & INTEGRATION LAYER -->
  <g transform="translate(570, 100)">
    <rect width="180" height="400" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="30" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">DATA LAYER</text>
    
    <!-- NoSQL DB -->
    <g transform="translate(15, 60)">
      <rect width="150" height="90" rx="8" fill="#1e293b" stroke="url(#neonGreen)" stroke-width="1.5" filter="url(#glow)"/>
      <ellipse cx="75" cy="25" rx="35" ry="10" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <path d="M40,25 L40,55 A35,10 0 0 0 110,55 L110,25" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <path d="M40,55 L40,75 A35,10 0 0 0 110,75 L110,55" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <text x="75" y="80" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">NoSQL DataStore</text>
    </g>
    
    <!-- File Storage -->
    <g transform="translate(15, 170)">
      <rect width="150" height="90" rx="8" fill="#1e293b" stroke="url(#neonGreen)" stroke-width="1.5"/>
      <!-- Storage Icon -->
      <rect x="60" y="15" width="30" height="35" rx="3" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <path d="M60,25 L90,25 M60,35 L90,35" stroke="#34d399" stroke-width="1.5"/>
      <text x="75" y="70" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Cloud Storage</text>
    </g>
    
    <!-- Authentication Service -->
    <g transform="translate(15, 280)">
      <rect width="150" height="90" rx="8" fill="#1e293b" stroke="url(#neonGreen)" stroke-width="1.5"/>
      <!-- Lock Icon -->
      <rect x="63" y="25" width="24" height="18" rx="2" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <path d="M68,25 L68,20 A7,7 0 0 1 82,20 L82,25" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="75" cy="32" r="2" fill="#34d399"/>
      <text x="75" y="70" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Auth &amp; User Mgmt</text>
    </g>
  </g>
  
  <!-- Overlay Title -->
  <rect x="250" y="520" width="300" height="50" rx="25" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
  <text x="400" y="551" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">ZOHO CATALYST ARCHITECTURE</text>
</svg>
