<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <g stroke="#334155" stroke-width="0.5" opacity="0.15">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>

  <!-- World Grid Network (Abstract reliability) -->
  <g stroke="#334155" stroke-width="1" opacity="0.4" fill="none">
    <circle cx="250" cy="175" r="120"/>
    <circle cx="250" cy="175" r="80"/>
    <circle cx="250" cy="175" r="40"/>
    <line x1="100" y1="175" x2="400" y2="175"/>
    <line x1="250" y1="25" x2="250" y2="325"/>
    <path d="M150,100 C200,120 300,120 350,100"/>
    <path d="M150,250 C200,230 300,230 350,250"/>
  </g>

  <!-- Server Clusters (Uptime hotspots) -->
  <g transform="translate(180, 110)">
    <rect width="140" height="130" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="140" height="20" rx="3" fill="#0f172a"/>
    <text x="70" y="14" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="bold">ACTIVE UPTIME</text>
    
    <!-- System statuses -->
    <g transform="translate(15, 35)">
      <circle cx="10" cy="10" r="5" fill="#10b981"/>
      <text x="25" y="14" fill="#e5e7eb" font-family="sans-serif" font-size="11">US East (Primary)</text>
      
      <circle cx="10" cy="35" r="5" fill="#10b981"/>
      <text x="25" y="39" fill="#e5e7eb" font-family="sans-serif" font-size="11">EU West (Failover)</text>
      
      <circle cx="10" cy="60" r="5" fill="#10b981"/>
      <text x="25" y="64" fill="#e5e7eb" font-family="sans-serif" font-size="11">AU East (Active)</text>
    </g>
    
    <text x="70" y="115" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold" filter="url(#glow)">99.999%</text>
  </g>

  <!-- Reliability badges -->
  <g transform="translate(30, 130)">
    <rect width="90" height="50" rx="6" fill="#1e293b" stroke="#4b5563" stroke-width="1"/>
    <text x="45" y="22" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="9" font-weight="bold">COMPLIANT</text>
    <text x="45" y="40" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">SOC2 / GDPR</text>
  </g>
  
  <g transform="translate(380, 130)">
    <rect width="90" height="50" rx="6" fill="#1e293b" stroke="#4b5563" stroke-width="1"/>
    <text x="45" y="22" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="9" font-weight="bold">DDOS SHIELD</text>
    <text x="45" y="40" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">ENABLED</text>
  </g>
</svg>
