<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>

  <!-- Cost optimization trends graph -->
  <g transform="translate(50, 60)">
    <text x="20" y="25" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">IT Spend Optimization &amp; Savings</text>
    
    <!-- Y-axis -->
    <line x1="40" y1="50" x2="40" y2="220" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="220" x2="420" y2="220" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Cost curve down (Savings) -->
    <path d="M40,70 L120,95 L200,120 L280,180 L360,200 C380,205 400,208 420,210" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="3 3"/>
    <text x="130" y="85" fill="#f87171" font-family="sans-serif" font-size="9" font-weight="bold">Traditional VM Cost</text>
    
    <!-- Optimization curve up (ROI) -->
    <path d="M40,210 L120,180 L200,140 L280,95 L360,65 L420,50" fill="none" stroke="#10b981" stroke-width="3" filter="url(#glow)"/>
    <text x="280" y="80" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">Zoho IT ROI</text>
    
    <!-- Highlights -->
    <circle cx="360" cy="65" r="4" fill="#34d399"/>
    <circle cx="420" cy="50" r="4" fill="#34d399"/>
    
    <text x="40" y="235" fill="#94a3b8" font-family="sans-serif" font-size="9">Month 1</text>
    <text x="200" y="235" fill="#94a3b8" font-family="sans-serif" font-size="9">Month 6</text>
    <text x="360" y="235" fill="#94a3b8" font-family="sans-serif" font-size="9">Month 12</text>
  </g>
</svg>
