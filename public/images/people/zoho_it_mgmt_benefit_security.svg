<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>

  <!-- Glowing Security Shield in Center -->
  <g transform="translate(180, 50)">
    <circle cx="70" cy="80" r="65" fill="#10b981" opacity="0.05" filter="url(#glow)"/>
    <!-- Shield path -->
    <path d="M70,30 L115,45 C115,95 70,125 70,125 C70,125 25,95 25,45 Z" fill="none" stroke="#10b981" stroke-width="3.5" filter="url(#glow)"/>
    <path d="M57,75 L67,85 L85,67" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="160" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">INFRASTRUCTURE</text>
    <text x="70" y="180" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">SECURE &amp; COMPLIANT</text>
  </g>

  <!-- Security logs Left -->
  <g transform="translate(30, 90)">
    <rect width="120" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="bold">COMPLIANCE STATE</text>
    <g transform="translate(10, 45)">
      <text x="0" y="15" fill="#34d399" font-family="sans-serif" font-size="10">✔ GDPR - Verified</text>
      <text x="0" y="35" fill="#34d399" font-family="sans-serif" font-size="10">✔ HIPAA - Verified</text>
      <text x="0" y="55" fill="#34d399" font-family="sans-serif" font-size="10">✔ SOC2 - Certified</text>
      <text x="0" y="75" fill="#34d399" font-family="sans-serif" font-size="10">✔ PCI - Verified</text>
    </g>
  </g>

  <!-- Firewalls Right -->
  <g transform="translate(350, 90)">
    <rect width="120" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="bold">IPS/IDS SHIELD</text>
    <g transform="translate(10, 45)">
      <text x="0" y="15" fill="#38bdf8" font-family="sans-serif" font-size="10">Status: Active</text>
      <text x="0" y="35" fill="#34d399" font-family="sans-serif" font-size="10">Intrusions: 0</text>
      <text x="0" y="55" fill="#38bdf8" font-family="sans-serif" font-size="10">DDoS: Shielded</text>
      <text x="0" y="75" fill="#e5e7eb" font-family="sans-serif" font-size="10">API Gateway: OK</text>
    </g>
  </g>
</svg>
