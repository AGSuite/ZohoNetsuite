<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none"/></pattern>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>

  <!-- Network circuit lines -->
  <path d="M100,300 L250,300 L350,150 L550,150 L650,300 L800,300" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M250,300 L300,450 L500,450 L550,300" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Server Rack representation (center top) -->
  <g transform="translate(320, 100)">
    <rect width="160" height="150" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="80" y="22" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">DATACENTER CLUSTER</text>
    
    <!-- Rack 1 -->
    <rect x="15" y="35" width="130" height="25" rx="3" fill="#1e293b" stroke="#334155"/>
    <circle cx="28" cy="47.5" r="3" fill="#10b981"/>
    <line x1="45" y1="47.5" x2="115" y2="47.5" stroke="#10b981" stroke-width="2" stroke-dasharray="2 3"/>
    
    <!-- Rack 2 -->
    <rect x="15" y="70" width="130" height="25" rx="3" fill="#1e293b" stroke="#334155"/>
    <circle cx="28" cy="82.5" r="3" fill="#10b981"/>
    <line x1="45" y1="82.5" x2="115" y2="82.5" stroke="#10b981" stroke-width="2" stroke-dasharray="2 3"/>

    <!-- Rack 3 -->
    <rect x="15" y="105" width="130" height="25" rx="3" fill="#1e293b" stroke="#334155"/>
    <circle cx="28" cy="117.5" r="3" fill="#f59e0b"/>
    <line x1="45" y1="117.5" x2="115" y2="117.5" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 3"/>
  </g>

  <!-- Endpoint Security (Left column) -->
  <g transform="translate(80, 200)">
    <rect width="180" height="200" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">SECURE ENDPOINTS</text>
    
    <!-- Laptop symbol -->
    <rect x="35" y="45" width="110" height="65" rx="4" fill="#1e293b" stroke="url(#glowBlue)" stroke-width="1.5"/>
    <rect x="25" y="110" width="130" height="8" rx="2" fill="#334155"/>
    
    <!-- Shield on screen -->
    <circle cx="90" cy="77.5" r="18" fill="none" stroke="url(#glowGreen)" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M84,77.5 L88,81.5 L97,72.5" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="90" y="155" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">142 Endpoints</text>
    <text x="90" y="175" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">100% Protected</text>
  </g>

  <!-- Network Traffic / Helpdesk (Right column) -->
  <g transform="translate(540, 200)">
    <rect width="180" height="200" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">MONITORING &amp; TICKETS</text>
    
    <!-- Status Chart inside -->
    <rect x="20" y="45" width="140" height="90" rx="6" fill="#1e293b" stroke="#334155"/>
    <path d="M30,110 L60,85 L90,100 L120,65 L150,75" fill="none" stroke="url(#glowBlue)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="120" cy="65" r="3" fill="#38bdf8"/>
    
    <!-- Ticket queue info -->
    <g transform="translate(20, 150)">
      <text x="0" y="15" fill="#e5e7eb" font-family="sans-serif" font-size="12">Active Tickets: <tspan fill="#fb923c" font-weight="bold">5</tspan></text>
      <text x="0" y="35" fill="#e5e7eb" font-family="sans-serif" font-size="12">SLA Compliance: <tspan fill="#34d399" font-weight="bold">99.8%</tspan></text>
    </g>
  </g>
  
  <!-- Connections (Animated look) -->
  <g stroke="url(#glowBlue)" stroke-width="1.5" fill="none" stroke-dasharray="4 4" opacity="0.7">
    <path d="M260,300 L320,180"/>
    <path d="M540,300 L480,180"/>
  </g>
</svg>
