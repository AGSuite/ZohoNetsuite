<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Central Hub Orchestrator (Unified System) -->
  <circle cx="250" cy="175" r="50" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  <text x="250" y="180" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">IT HUB</text>
  
  <!-- Connected systems -->
  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="250" y1="125" x2="250" y2="70"/>
    <line x1="250" y1="225" x2="250" y2="280"/>
    <line x1="200" y1="175" x2="100" y2="175"/>
    <line x1="300" y1="175" x2="400" y2="175"/>
  </g>
  
  <!-- System Nodes -->
  <g transform="translate(200, 30)">
    <rect width="100" height="40" rx="6" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="middle" fill="#e5e7eb" font-family="sans-serif" font-size="10" font-weight="bold">NETWORKS</text>
  </g>
  
  <g transform="translate(200, 280)">
    <rect width="100" height="40" rx="6" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="middle" fill="#e5e7eb" font-family="sans-serif" font-size="10" font-weight="bold">ENDPOINTS</text>
  </g>
  
  <g transform="translate(30, 155)">
    <rect width="90" height="40" rx="6" fill="#1f2937" stroke="#a855f7" stroke-width="1.5"/>
    <text x="45" y="25" text-anchor="middle" fill="#e5e7eb" font-family="sans-serif" font-size="10" font-weight="bold">HELPDESK</text>
  </g>
  
  <g transform="translate(380, 155)">
    <rect width="90" height="40" rx="6" fill="#1f2937" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="45" y="25" text-anchor="middle" fill="#e5e7eb" font-family="sans-serif" font-size="10" font-weight="bold">SECURITY</text>
  </g>
</svg>
