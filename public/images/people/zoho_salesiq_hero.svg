<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Definitions of Gradients and Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Blue Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Violet Gradient -->
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0.1" />
    </linearGradient>

    <!-- Chat Bubble Visitor -->
    <linearGradient id="bubbleVisitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Chat Bubble Agent -->
    <linearGradient id="bubbleAgent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Zobot Accent Gradient -->
    <linearGradient id="zobotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Success Graph Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="700" cy="100" r="250" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="100" cy="500" r="200" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450 M 0,500 L 800,500 M 0,550 L 800,550" />
    <path d="M 50,0 L 50,600 M 100,0 L 100,600 M 150,0 L 150,600 M 200,0 L 200,600 M 250,0 L 250,600 M 300,0 L 300,600 M 350,0 L 350,600 M 400,0 L 400,600 M 450,0 L 450,600 M 500,0 L 500,600 M 550,0 L 550,600 M 600,0 L 600,600 M 650,0 L 650,600 M 700,0 L 700,600 M 750,0 L 750,600" />
  </g>

  <!-- Decorative Orbit Lines -->
  <circle cx="400" cy="300" r="280" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1" />
  <circle cx="400" cy="300" r="220" fill="none" stroke="#3b82f6" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="10 5" />

  <!-- MAIN CONSOLE PANEL -->
  <g filter="url(#shadow)" transform="translate(60, 50)">
    <!-- Main Panel Container -->
    <rect width="680" height="500" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect width="680" height="48" rx="16" fill="#0f172a" />
    <rect width="680" height="16" y="32" fill="#0f172a" />
    <line x1="0" y1="48" x2="680" y2="48" stroke="#1e293b" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="24" r="6" fill="#ef4444" />
    <circle cx="44" cy="24" r="6" fill="#f59e0b" />
    <circle cx="64" cy="24" r="6" fill="#10b981" />
    
    <!-- Status Indicator -->
    <rect x="530" y="14" width="130" height="20" rx="10" fill="#1e293b" />
    <circle cx="545" cy="24" r="4" fill="#10b981" filter="url(#glow)" />
    <text x="557" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" font-weight="bold">ZOBOT LIVE AGENT</text>

    <!-- Left Sidebar: Channels & Navigation -->
    <g transform="translate(0, 48)">
      <rect width="70" height="452" rx="0" fill="#0f172a" />
      <line x1="70" y1="0" x2="70" y2="452" stroke="#1e293b" stroke-width="1" />
      
      <!-- App Icons -->
      <!-- Chat Icon -->
      <rect x="18" y="24" width="34" height="34" rx="8" fill="#3b82f6" />
      <path d="M27 36 L27 43 L34 39.5 C36.5 39.5 39 37.5 39 35 C39 31.5 36 29 33 29 C29.5 29 27 31.5 27 35 C27 35.3 27 35.7 27 36 Z" fill="#ffffff" transform="translate(-5, -6)" />
      
      <!-- Visitor Analytics Icon -->
      <circle cx="35" cy="94" r="17" fill="#1e293b" />
      <path d="M29 97 L32 94 L35 98 L41 90" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" />
      
      <!-- Automation / Zobot Settings Icon -->
      <circle cx="35" cy="154" r="17" fill="#1e293b" />
      <rect x="29" y="148" width="12" height="12" rx="2" stroke="#a855f7" stroke-width="2" fill="none" />
      <circle cx="35" cy="154" r="2" fill="#a855f7" />

      <!-- Integration Icon -->
      <circle cx="35" cy="214" r="17" fill="#1e293b" />
      <path d="M30 214 A 5 5 0 0 1 40 214" stroke="#e2e8f0" stroke-width="2" fill="none" />
      <circle cx="30" cy="214" r="2" fill="#e2e8f0" />
      <circle cx="40" cy="214" r="2" fill="#e2e8f0" />
    </g>

    <!-- Central Workspace: Chat Dashboard -->
    <g transform="translate(70, 48)">
      <!-- 2-Column Workspace inside Panel -->
      <!-- Left Column: Chat Conversation Interface -->
      <g transform="translate(20, 20)">
        <!-- Chat Console Body -->
        <rect width="320" height="412" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
        
        <!-- Chat Header -->
        <path d="M0 12 A 12 12 0 0 1 12 0 L 308 0 A 12 12 0 0 1 320 12 L 320 50 L 0 50 Z" fill="#0f172a" />
        <circle cx="28" cy="25" r="14" fill="#a855f7" />
        <!-- Bot Face Illustration -->
        <rect x="21" y="21" width="14" height="8" rx="2" fill="#ffffff" />
        <circle cx="25" cy="25" r="1.5" fill="#a855f7" />
        <circle cx="31" cy="25" r="1.5" fill="#a855f7" />
        <path d="M25 31 Q28 33 31 31" stroke="#ffffff" stroke-width="1" fill="none" />

        <text x="52" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Zobot AI Assistant</text>
        <text x="52" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#10b981">Online &amp; Active</text>
        
        <!-- Chat Messages -->
        <!-- Message 1: Visitor -->
        <g transform="translate(15, 70)">
          <!-- Visitor Avatar -->
          <circle cx="15" cy="15" r="12" fill="#e2e8f0" />
          <text x="12" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0f172a" font-weight="bold">V</text>
          
          <!-- Message Bubble -->
          <rect x="35" y="0" width="220" height="54" rx="8" fill="url(#bubbleVisitor)" />
          <text x="47" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" font-weight="bold">Visitor (Austin, TX)</text>
          <text x="47" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f8fafc">I am looking to integrate live chat with</text>
          <text x="47" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f8fafc">our Zoho CRM lead pipeline.</text>
        </g>
        
        <!-- Message 2: Zobot Response -->
        <g transform="translate(15, 140)">
          <!-- Bot Avatar -->
          <circle cx="280" cy="15" r="12" fill="url(#zobotGrad)" />
          <rect x="275" y="12" width="10" height="6" rx="1.5" fill="#ffffff" />
          
          <!-- Message Bubble -->
          <rect x="30" y="0" width="230" height="74" rx="8" fill="url(#bubbleAgent)" />
          <text x="42" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#bfdbfe" font-weight="bold">Zobot AI Engine</text>
          <text x="42" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff">Sure! Zoho SalesIQ seamlessly syncs lead</text>
          <text x="42" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff">details and chat histories to Zoho CRM.</text>
          <text x="42" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff">Would you like to schedule an expert call?</text>
        </g>

        <!-- Message 3: Lead Auto-Created Status Alert -->
        <g transform="translate(15, 230)">
          <rect x="35" y="0" width="230" height="34" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
          <circle cx="50" cy="17" r="6" fill="#a855f7" />
          <path d="M48 17 L50 19 L53 15" stroke="#ffffff" stroke-width="1.5" fill="none" />
          <text x="65" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#c084fc" font-weight="bold">CRM Integration: Lead Auto-Created</text>
        </g>

        <!-- Chat Input Footer Mockup -->
        <path d="M0 360 L 320 360 L 320 400 A 12 12 0 0 1 308 412 L 12 412 A 12 12 0 0 1 0 400 Z" fill="#0f172a" />
        <rect x="15" y="372" width="240" height="26" rx="13" fill="#1e293b" />
        <text x="30" y="389" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Write a message...</text>
        <circle cx="288" cy="385" r="14" fill="#3b82f6" />
        <path d="M283 385 L292 385 M288 381 L292 385 L288 389" stroke="#ffffff" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" />
      </g>

      <!-- Right Column: Real-time Visitor & Analytics Panels -->
      <g transform="translate(360, 20)">
        <!-- Live Visitor Radar Card -->
        <g transform="translate(0, 0)">
          <rect width="230" height="190" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
          <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Real-time Visitor Paths</text>
          
          <!-- Radar Visualizer -->
          <circle cx="115" cy="110" r="55" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" />
          <circle cx="115" cy="110" r="35" fill="none" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1.5" />
          <!-- Pulsing Sweep Line -->
          <line x1="115" y1="110" x2="155" y2="72" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />
          
          <!-- Active Visitor Dots -->
          <circle cx="95" cy="90" r="5" fill="#10b981" filter="url(#glow)" />
          <circle cx="145" cy="125" r="4" fill="#f59e0b" filter="url(#glow)" />
          <circle cx="110" cy="140" r="5" fill="#3b82f6" filter="url(#glow)" />
        </g>

        <!-- Conversions & Analytics Graph Card -->
        <g transform="translate(0, 210)">
          <rect width="230" height="202" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
          <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Lead Conversion Rate</text>
          <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#10b981" font-weight="bold">+45.2%</text>
          <text x="96" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">vs last week</text>
          
          <!-- Chart Graph Area -->
          <!-- Graph Fill under Line -->
          <path d="M16 160 L16 120 Q 50 110 70 135 T 140 100 T 214 75 L214 160 Z" fill="url(#greenGrad)" />
          <!-- Graph Line -->
          <path d="M16 120 Q 50 110 70 135 T 140 100 T 214 75" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
          
          <!-- Chart Dots -->
          <circle cx="214" cy="75" r="5" fill="#ffffff" stroke="#10b981" stroke-width="2" />

          <!-- X & Y Axes labels -->
          <line x1="16" y1="160" x2="214" y2="160" stroke="#1e293b" stroke-width="1" />
          <text x="18" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">Mon</text>
          <text x="80" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">Wed</text>
          <text x="142" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">Fri</text>
          <text x="198" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">Sun</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Ambient Front Overlay Particles for depth -->
  <g opacity="0.4">
    <circle cx="120" cy="180" r="3" fill="#3b82f6" />
    <circle cx="680" cy="460" r="4" fill="#a855f7" />
    <circle cx="710" cy="220" r="2.5" fill="#10b981" />
  </g>
</svg>
