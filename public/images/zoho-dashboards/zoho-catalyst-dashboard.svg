<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <!-- Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Sidebar -->
  <g transform="translate(0, 0)">
    <rect width="70" height="500" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Logo placeholder -->
    <circle cx="35" cy="40" r="15" fill="#3b82f6" opacity="0.8"/>
    <polygon points="30,45 35,33 40,45" fill="#ffffff"/>
    
    <!-- Sidebar Icons -->
    <rect x="20" y="90" width="30" height="30" rx="6" fill="#1e293b"/>
    <rect x="25" y="95" width="20" height="20" rx="3" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    
    <rect x="25" y="150" width="20" height="20" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="35" cy="160" r="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    
    <rect x="25" y="200" width="20" height="20" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M28,210 L42,210 M35,203 L35,217" stroke="#94a3b8" stroke-width="1.5"/>
    
    <rect x="25" y="250" width="20" height="20" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M28,260 L42,260" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Top Bar -->
  <g transform="translate(70, 0)">
    <rect width="730" height="60" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="30" y="36" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Catalyst Console</text>
    <text x="180" y="35" fill="#3b82f6" font-family="monospace" font-size="12" font-weight="bold">Project: production-env-01</text>
    <rect x="620" y="15" width="80" height="30" rx="15" fill="#10b981" opacity="0.2"/>
    <text x="660" y="34" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">Active</text>
  </g>

  <!-- Dashboard Grid Contents -->
  <g transform="translate(90, 80)">
    <!-- KPI 1: Execution Count -->
    <g transform="translate(0, 0)">
      <rect width="210" height="100" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
      <text x="20" y="30" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="bold">TOTAL FUNCTION CALLS</text>
      <text x="20" y="65" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="bold" filter="url(#glow)">2,485,102</text>
      <text x="20" y="85" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">▲ 12.4% vs last week</text>
    </g>
    
    <!-- KPI 2: Success Rate -->
    <g transform="translate(230, 0)">
      <rect width="210" height="100" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
      <text x="20" y="30" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="bold">EXECUTION SUCCESS RATE</text>
      <text x="20" y="65" fill="#34d399" font-family="monospace" font-size="28" font-weight="bold" filter="url(#glow)">99.98%</text>
      <text x="20" y="85" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="bold">Avg Latency: 42ms</text>
    </g>
    
    <!-- KPI 3: DB Operations -->
    <g transform="translate(460, 0)">
      <rect width="230" height="100" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
      <text x="20" y="30" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="bold">DATABASE READ/WRITE</text>
      <text x="20" y="65" fill="#a855f7" font-family="monospace" font-size="28" font-weight="bold" filter="url(#glow)">85.4k/sec</text>
      <text x="20" y="85" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">Storage: 18.2 GB</text>
    </g>

    <!-- Main Chart: Performance Analytics -->
    <g transform="translate(0, 120)">
      <rect width="440" height="270" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
      <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Performance &amp; Scale Trends</text>
      
      <!-- Chart lines -->
      <line x1="40" y1="210" x2="400" y2="210" stroke="#4b5563" stroke-width="1"/>
      <line x1="40" y1="140" x2="400" y2="140" stroke="#374151" stroke-dasharray="4 4" stroke-width="1"/>
      <line x1="40" y1="70" x2="400" y2="70" stroke="#374151" stroke-dasharray="4 4" stroke-width="1"/>
      
      <!-- Graph path (glowing blue) -->
      <path d="M40,200 L80,180 L120,195 L160,110 L200,135 L240,65 L280,85 L320,50 L360,75 L400,35" fill="none" stroke="url(#neonBlue)" stroke-width="3" filter="url(#glow)"/>
      <path d="M40,200 L80,180 L120,195 L160,110 L200,135 L240,65 L280,85 L320,50 L360,75 L400,35 L400,210 L40,210 Z" fill="url(#neonBlue)" opacity="0.1"/>
      
      <!-- Graph points -->
      <circle cx="160" cy="110" r="4" fill="#38bdf8"/>
      <circle cx="240" cy="65" r="4" fill="#38bdf8"/>
      <circle cx="320" cy="50" r="4" fill="#38bdf8"/>
      <circle cx="400" cy="35" r="4" fill="#38bdf8"/>
      
      <text x="40" y="230" fill="#9ca3af" font-family="sans-serif" font-size="10">00:00</text>
      <text x="160" y="230" fill="#9ca3af" font-family="sans-serif" font-size="10">06:00</text>
      <text x="280" y="230" fill="#9ca3af" font-family="sans-serif" font-size="10">12:00</text>
      <text x="400" y="230" fill="#9ca3af" font-family="sans-serif" font-size="10">18:00</text>
    </g>

    <!-- Sidebar Right: Active Functions list -->
    <g transform="translate(460, 120)">
      <rect width="230" height="270" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
      <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Microservices (Functions)</text>
      
      <g transform="translate(15, 50)">
        <rect width="200" height="45" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="15" y="26" fill="#e5e7eb" font-family="monospace" font-size="11">auth_handler.js</text>
        <circle cx="180" cy="22" r="4" fill="#10b981"/>
      </g>
      
      <g transform="translate(15, 105)">
        <rect width="200" height="45" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="15" y="26" fill="#e5e7eb" font-family="monospace" font-size="11">payment_gateway.py</text>
        <circle cx="180" cy="22" r="4" fill="#10b981"/>
      </g>
      
      <g transform="translate(15, 160)">
        <rect width="200" height="45" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="15" y="26" fill="#e5e7eb" font-family="monospace" font-size="11">pdf_invoice_generator.java</text>
        <circle cx="180" cy="22" r="4" fill="#f59e0b"/>
      </g>
      
      <g transform="translate(15, 215)">
        <rect width="200" height="45" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="15" y="26" fill="#e5e7eb" font-family="monospace" font-size="11">image_resizer.js</text>
        <circle cx="180" cy="22" r="4" fill="#10b981"/>
      </g>
    </g>
  </g>
</svg>
