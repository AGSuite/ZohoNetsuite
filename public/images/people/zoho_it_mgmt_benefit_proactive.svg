<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>

  <!-- Left: Metric Alert Gauge -->
  <g transform="translate(40, 75)">
    <rect width="180" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">PROACTIVE HEALTH</text>
    
    <path d="M50,150 A50,50 0 1,1 130,150" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
    <path d="M50,150 A50,50 0 0,1 110,70" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    
    <text x="90" y="125" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">92% Load</text>
    <text x="90" y="145" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="10" font-weight="bold">WARN STATE</text>
  </g>

  <!-- Flow connector -->
  <path d="M240,175 L280,175" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="280,170 290,175 280,180" fill="#f59e0b"/>

  <!-- Right: Automated Ticket workflow -->
  <g transform="translate(300, 75)">
    <rect width="160" height="200" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
    <text x="80" y="25" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="10" font-weight="bold">AUTO RESOLUTION</text>
    
    <g transform="translate(15, 50)">
      <rect width="130" height="40" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="10" y="24" fill="#fb923c" font-family="sans-serif" font-size="10" font-weight="bold">Ticket Created</text>
    </g>
    
    <g transform="translate(15, 105)">
      <rect width="130" height="40" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="10" y="24" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">Assign: DevOps</text>
    </g>
    
    <g transform="translate(15, 160)">
      <rect width="130" height="30" rx="4" fill="#10b981" opacity="0.2"/>
      <text x="80" y="19" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">SLA Track Active</text>
    </g>
  </g>
</svg>
