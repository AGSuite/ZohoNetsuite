<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <g stroke="#334155" stroke-width="0.5" opacity="0.15">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>

  <!-- Pricing Graph -->
  <g transform="translate(60, 60)">
    <!-- Axes -->
    <line x1="40" y1="200" x2="380" y2="200" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="30" x2="40" y2="200" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Y-Axis labels -->
    <text x="30" y="35" text-anchor="end" fill="#64748b" font-family="sans-serif" font-size="10">Cost ($)</text>
    <text x="30" y="90" text-anchor="end" fill="#64748b" font-family="sans-serif" font-size="10">High</text>
    <text x="30" y="150" text-anchor="end" fill="#64748b" font-family="sans-serif" font-size="10">Low</text>
    <text x="35" y="204" text-anchor="end" fill="#34d399" font-family="monospace" font-weight="bold" font-size="11">$0</text>
    
    <!-- X-Axis labels -->
    <text x="380" y="220" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">Executions / Traffic</text>
    <text x="40" y="220" text-anchor="middle" fill="#34d399" font-family="monospace" font-weight="bold" font-size="11">0</text>
    <text x="200" y="220" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">1M</text>
    <text x="320" y="220" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">10M</text>
    
    <!-- Traditional Server Cost Line (Flat high rate) -->
    <line x1="40" y1="80" x2="360" y2="80" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="365" y="84" fill="#f87171" font-family="sans-serif" font-size="9" font-weight="bold">Traditional VM Cost</text>
    
    <!-- Serverless Cost Line (Perfect scale-to-zero) -->
    <path d="M40,200 L120,200 L240,140 L360,60" fill="none" stroke="url(#neonGreen)" stroke-width="3" filter="url(#glow)"/>
    <text x="280" y="90" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">Catalyst Pay-As-You-Go</text>
    
    <!-- Scale to Zero Callout -->
    <circle cx="80" cy="200" r="15" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>
    <g transform="translate(110, 160)">
      <rect width="110" height="30" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
      <text x="55" y="19" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="10">SCALE TO ZERO</text>
    </g>
  </g>
</svg>
